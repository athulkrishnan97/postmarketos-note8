# Samsung Galaxy Note 8: Exynos8895 ABOX + Cirrus Logic CS47L93.
# ABOX UAIF0 <-> codec AIF1 (earpiece, headphones) on PCM 0; ABOX UAIF4 <->
# MAX98506 amplifier (bottom loudspeaker, 48 kHz only) on PCM 1.

SectionVerb {
	EnableSequence [
		cset "name='OUT3 Demux' HPOUT4"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	# The amplifier mutes briefly whenever its gain changes, so it stays at
	# the stock +13 dB and PulseAudio does the volume in software.
	EnableSequence [
		cset "name='Speaker Volume' 19"
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='HPOUT3L Input 1' AIF1RX1"
		cset "name='HPOUT3R Input 1' AIF1RX2"
		cset "name='HPOUT3 Digital Switch' on"
		cset "name='Earpiece Switch' on"
	]

	DisableSequence [
		cset "name='Earpiece Switch' off"
		cset "name='HPOUT3L Input 1' None"
		cset "name='HPOUT3R Input 1' None"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "HPOUT3 Digital"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='HPOUT2L Input 1' AIF1RX1"
		cset "name='HPOUT2R Input 1' AIF1RX2"
		cset "name='HPOUT2 Digital Switch' on"
		cset "name='Headphone Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Switch' off"
		cset "name='HPOUT2L Input 1' None"
		cset "name='HPOUT2R Input 1' None"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "HPOUT2 Digital"
	}
}
